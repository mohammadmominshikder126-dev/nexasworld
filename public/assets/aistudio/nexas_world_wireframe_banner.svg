<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#1a2330" />
  <!-- Geometric Wireframe N Mark -->
  <g transform="translate(170, 82) scale(0.84)" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left vertical double rails -->
    <line x1="22" y1="12" x2="22" y2="332" stroke-width="2.5" />
    <line x1="29" y1="16" x2="29" y2="332" stroke-width="1.8" opacity="0.85" />
    <line x1="22" y1="332" x2="29" y2="332" stroke-width="2.2" />

    <!-- Middle-left facet & node -->
    <line x1="22" y1="12" x2="62" y2="178" stroke-width="2.4" />
    <line x1="29" y1="16" x2="62" y2="178" stroke-width="1.6" opacity="0.8" />
    <line x1="62" y1="178" x2="29" y2="332" stroke-width="2.2" />

    <!-- Diagonal multi-wireframe struts -->
    <line x1="22" y1="12" x2="248" y2="332" stroke-width="2.5" />
    <line x1="29" y1="16" x2="248" y2="332" stroke-width="1.8" opacity="0.85" />
    <line x1="62" y1="178" x2="248" y2="332" stroke-width="2.4" />
    <line x1="62" y1="178" x2="218" y2="205" stroke-width="1.8" opacity="0.9" />

    <!-- Right vertical & angled struts -->
    <line x1="248" y1="12" x2="248" y2="332" stroke-width="2.4" />
    <line x1="248" y1="12" x2="218" y2="205" stroke-width="2.4" />
    <line x1="248" y1="12" x2="255" y2="12" stroke-width="2.2" />
    <line x1="255" y1="12" x2="255" y2="332" stroke-width="1.5" opacity="0.7" />
    <line x1="218" y1="205" x2="248" y2="332" stroke-width="2.4" />
    <line x1="22" y1="12" x2="218" y2="205" stroke-width="2" opacity="0.9" />

    <!-- Vertex nodes -->
    <circle cx="24" cy="14" r="5.5" fill="#1a2330" stroke="#ffffff" stroke-width="2.2" />
    <circle cx="24" cy="14" r="2.2" fill="#ffffff" stroke="none" />
    <circle cx="62" cy="178" r="5" fill="#1a2330" stroke="#ffffff" stroke-width="2.2" />
    <circle cx="62" cy="178" r="2" fill="#ffffff" stroke="none" />
    <circle cx="218" cy="205" r="4.5" fill="#1a2330" stroke="#ffffff" stroke-width="2" />
    <circle cx="218" cy="205" r="1.8" fill="#ffffff" stroke="none" />
    <circle cx="248" cy="332" r="6" fill="#1a2330" stroke="#ffffff" stroke-width="2.4" />
    <circle cx="248" cy="332" r="2.5" fill="#ffffff" stroke="none" />
  </g>

  <!-- Nexas World Wordmark -->
  <text
    x="475"
    y="252"
    fill="#ffffff"
    font-family="'Plus Jakarta Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="92"
    letter-spacing="-1"
  >
    <tspan font-weight="700">Nexas</tspan><tspan font-weight="300" dx="18">World</tspan>
  </text>

  <!-- Clean Bengali Assurance Panel inside the banner image -->
  <rect x="70" y="392" width="1060" height="142" rx="18" fill="#0f1724" fill-opacity="0.88" stroke="#334155" stroke-width="1.5" />
  <text
    x="600"
    y="452"
    text-anchor="middle"
    fill="#34d399"
    font-family="'Hind Siliguri', 'Noto Sans Bengali', 'Kohinoor Bangla', 'Nirmala UI', sans-serif"
    font-size="31"
    font-weight="700"
  >Nexasworld একটি বিশ্বস্ত এবং দীর্ঘমেয়াদী প্ল্যাটফর্ম</text>
  <text
    x="600"
    y="502"
    text-anchor="middle"
    fill="#f1f5f9"
    font-family="'Hind Siliguri', 'Noto Sans Bengali', 'Kohinoor Bangla', 'Nirmala UI', sans-serif"
    font-size="27"
    font-weight="600"
  >আপনার উপার্জন এবং আয় নিশ্চিত করে এবং দ্রুত পেমেন্ট সম্পন্ন করে</text>
</svg>
